<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700&display=swap"><style>
html,body{margin:0;background:var(--surface-tint)}
body{padding:20px}
.pv-stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center}
.pv-col{display:grid;gap:10px;justify-items:center}
.pv-cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);text-align:center}
.pv-browser{width:var(--w,760px);height:var(--h,auto);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-md),0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column}
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-sky)}
.pv-dots{display:flex;gap:6px}.pv-dots i{width:10px;height:10px;border-radius:50%;background:var(--sky-300)}
.pv-url{flex:1;min-width:0;height:26px;border-radius:13px;background:var(--surface);color:var(--ink-muted);font:400 12px/26px var(--font-mono);padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-body{position:relative;flex:1;overflow:hidden;background:var(--surface-tint);display:flex;flex-direction:column}
.pv-body>.cn-app,.pv-body>.cn-auth,.pv-body>.cn-pagewrap{flex:1 0 auto}
.pv-body.pv-scroll{overflow:hidden auto}
.pv-body .cn-overlay,.pv-body .cn-fullscreen{position:absolute}
.pv-phone{width:360px;height:var(--h,700px);background:var(--surface);border-radius:38px;box-shadow:var(--shadow-lg),0 0 0 8px var(--ink);overflow:hidden;display:flex;flex-direction:column;margin:8px}
.pv-status{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:600 12px/1 var(--font-sans);color:var(--ink);background:var(--surface)}
.pv-status i{width:54px;height:6px;border-radius:3px;background:var(--ink)}
.pv-phone .pv-body{background:var(--surface-tint)}
.pv-form{padding:28px;display:grid;gap:14px;max-width:560px;margin:0 auto}
.pv-form .t{height:76px;border-radius:12px;background:var(--surface);border-top:10px solid var(--sky-300);padding:16px}
.pv-form .t i{display:block;height:14px;width:56%;background:var(--line);border-radius:7px}
.pv-form .q{background:var(--surface);border-radius:12px;padding:18px;display:grid;gap:10px;border:1px solid var(--line)}
.pv-form .q i{display:block;height:12px;border-radius:6px;background:var(--line)}
.pv-form .q i:first-child{width:70%;height:14px;background:var(--sky-200)}
.pv-form .q u{display:flex;gap:10px;align-items:center;text-decoration:none}
.pv-form .q u::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong)}
.pv-form .q u::after{content:"";height:10px;width:40%;border-radius:5px;background:var(--line)}
.pv-hudslot{position:absolute;top:14px;right:14px;z-index:3}
.pv-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;width:100%}
.pv-tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px;align-content:start}
.pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head><body class="cn"><div style="display:grid;gap:24px">
<div class="pv-row"><button class="cn-btn cn-btn--primary"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add test</button><button class="cn-btn cn-btn--secondary">Save draft</button><button class="cn-btn cn-btn--ghost">Cancel</button><button class="cn-btn cn-btn--danger"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Lock exam</button></div>
<div class="pv-row"><button class="cn-btn cn-btn--primary cn-btn--lg"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Start exam</button><button class="cn-btn cn-btn--primary">Medium</button><button class="cn-btn cn-btn--primary cn-btn--sm">Small</button><button class="cn-btn cn-btn--primary cn-btn--sm"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8 11V8a4 4 0 017.6-1.7"/></svg>Unlock</button></div>
<div class="pv-row"><button class="cn-btn cn-btn--primary is-hover">Hover</button><button class="cn-btn cn-btn--primary is-focus">Focus</button><button class="cn-btn cn-btn--primary" disabled>Disabled</button><button class="cn-btn cn-btn--secondary is-hover">Hover</button></div>
<div style="max-width:340px"><button class="cn-btn cn-btn--primary cn-btn--lg cn-btn--block">Continue with Google</button></div></div></body></html>
