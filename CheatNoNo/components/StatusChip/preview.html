<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700&display=swap"><style>
html,body{margin:0;background:var(--surface-tint)}
body{padding:20px}
.pv-stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center}
.pv-col{display:grid;gap:10px;justify-items:center}
.pv-cap{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);text-align:center}
.pv-browser{width:var(--w,760px);height:var(--h,auto);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-md),0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column}
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-sky)}
.pv-dots{display:flex;gap:6px}.pv-dots i{width:10px;height:10px;border-radius:50%;background:var(--sky-300)}
.pv-url{flex:1;min-width:0;height:26px;border-radius:13px;background:var(--surface);color:var(--ink-muted);font:400 12px/26px var(--font-mono);padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-body{position:relative;flex:1;overflow:hidden;background:var(--surface-tint);display:flex;flex-direction:column}
.pv-body>.cn-app,.pv-body>.cn-auth,.pv-body>.cn-pagewrap{flex:1 0 auto}
.pv-body.pv-scroll{overflow:hidden auto}
.pv-body .cn-overlay,.pv-body .cn-fullscreen{position:absolute}
.pv-phone{width:360px;height:var(--h,700px);background:var(--surface);border-radius:38px;box-shadow:var(--shadow-lg),0 0 0 8px var(--ink);overflow:hidden;display:flex;flex-direction:column;margin:8px}
.pv-status{height:28px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:600 12px/1 var(--font-sans);color:var(--ink);background:var(--surface)}
.pv-status i{width:54px;height:6px;border-radius:3px;background:var(--ink)}
.pv-phone .pv-body{background:var(--surface-tint)}
.pv-form{padding:28px;display:grid;gap:14px;max-width:560px;margin:0 auto}
.pv-form .t{height:76px;border-radius:12px;background:var(--surface);border-top:10px solid var(--sky-300);padding:16px}
.pv-form .t i{display:block;height:14px;width:56%;background:var(--line);border-radius:7px}
.pv-form .q{background:var(--surface);border-radius:12px;padding:18px;display:grid;gap:10px;border:1px solid var(--line)}
.pv-form .q i{display:block;height:12px;border-radius:6px;background:var(--line)}
.pv-form .q i:first-child{width:70%;height:14px;background:var(--sky-200)}
.pv-form .q u{display:flex;gap:10px;align-items:center;text-decoration:none}
.pv-form .q u::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong)}
.pv-form .q u::after{content:"";height:10px;width:40%;border-radius:5px;background:var(--line)}
.pv-hudslot{position:absolute;top:14px;right:14px;z-index:3}
.pv-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;width:100%}
.pv-tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px;align-content:start}
.pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head><body class="cn"><div style="display:grid;gap:24px"><div class="pv-row" style="gap:20px;align-items:flex-start"><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--active"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/></svg>Active</span><span class="cn-data" style="font-size:11px">active</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--away"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.8"/></svg>Away</span><span class="cn-data" style="font-size:11px">away</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--warned"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2l9 15.6H3z"/><path d="M12 10v4.2M12 17.2v.1"/></svg>Warned</span><span class="cn-data" style="font-size:11px">warned</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--locked"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Locked</span><span class="cn-data" style="font-size:11px">locked</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--submitted"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Submitted</span><span class="cn-data" style="font-size:11px">submitted</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--missing"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5a2 2 0 014 0V6h4.5v4.5H19a2 2 0 010 4h-1.5V19H13v-1.5a2 2 0 00-4 0V19H4.5v-4.5H6a2 2 0 000-4H4.5V6H9z"/></svg>Extension missing</span><span class="cn-data" style="font-size:11px">missing</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--live"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/></svg>Live</span><span class="cn-data" style="font-size:11px">live</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--draft"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1-4L16 5a2 2 0 013 3L8.5 18.5z"/></svg>Draft</span><span class="cn-data" style="font-size:11px">draft</span></div><div class="pv-col" style="gap:6px"><span class="cn-chip cn-chip--ended"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Ended</span><span class="cn-data" style="font-size:11px">ended</span></div></div><div class="pv-row" style="gap:24px"><span class="cn-chip cn-chip--flag"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 21V4M5.5 4.5h11l-2 4 2 4h-11"/></svg>3 flags</span><span class="cn-chip cn-chip--submitted"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 2.8v5.7c0 4.6-3.1 8-7.5 9.5-4.4-1.5-7.5-4.9-7.5-9.5V5.8z"/><path d="M8.8 12l2.4 2.4 4.2-4.6"/></svg>Protected exam</span><span class="cn-chip cn-chip--missing"><svg class="cn-ico " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg>AI assistants</span></div><div class="pv-row" style="gap:28px"><span class="cn-pips " role="img" aria-label="0 of 3 strikes"><i class="cn-pip"></i><i class="cn-pip"></i><i class="cn-pip"></i></span><span class="cn-pips " role="img" aria-label="1 of 3 strikes"><i class="cn-pip is-used"></i><i class="cn-pip"></i><i class="cn-pip"></i></span><span class="cn-pips cn-pips--danger" role="img" aria-label="2 of 3 strikes"><i class="cn-pip is-used"></i><i class="cn-pip is-used"></i><i class="cn-pip"></i></span><span class="cn-pips cn-pips--danger" role="img" aria-label="3 of 3 strikes"><i class="cn-pip is-used"></i><i class="cn-pip is-used"></i><i class="cn-pip is-used"></i></span></div></div></body></html>
